<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta charset="UTF-8">
        <title>Daily puzZXle</title>
        <style>
            /* Mobile-first: the Daily landing page is a simple scroll; the play
               page keeps screen on top, touch controls filling the rest (fire
               left third, 8-direction keypad right two-thirds). Deliberately
               plain - the design is a placeholder for the real one. */
            * { box-sizing: border-box; }
            html, body {
                margin: 0;
                height: 100%;
                overscroll-behavior: none;
                background: #101016;
            }
            body {
                font-family: Consolas, monospace;
                color: #c8c8ce;
                overflow: hidden;
                -webkit-user-select: none;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
            }
            #app, .app {
                height: 100dvh;
                display: flex;
                flex-direction: column;
            }

            /* ---- daily landing ---- */
            .daily {
                height: 100dvh;
                overflow-y: auto;
                padding: 24px 16px 32px;
                display: flex;
                flex-direction: column;
                gap: 20px;
                max-width: 720px;
                margin: 0 auto;
            }
            .dailyHead h1 {
                margin: 0;
                color: #4ee060;
                letter-spacing: 2px;
                font-size: 28px;
                text-shadow: 0 0 12px rgba(78, 224, 96, 0.35);
            }
            .dailyHead .tagline { margin: 6px 0 2px; color: #8a8a92; font-size: 13px; }
            .dailyHead .date { margin: 0; color: #e6d04e; font-size: 12px; }
            .cards { display: flex; flex-direction: column; gap: 14px; }
            .card {
                border: 1px solid #2e3444;
                border-radius: 8px;
                padding: 14px;
                background: #15181f;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .card.today { border-color: #4ee060; box-shadow: 0 0 14px rgba(78, 224, 96, 0.15); }
            .cardHead { display: flex; align-items: center; gap: 8px; }
            .cardGame { color: #fff; font-weight: bold; font-size: 18px; flex: 1; }
            .badge {
                color: #101016;
                background: #4ee060;
                border-radius: 3px;
                font-size: 10px;
                padding: 2px 6px;
                font-weight: bold;
            }
            .cardGoal { color: #c8c8ce; font-size: 13px; }
            .cardPb { color: #8a8a92; font-size: 12px; }
            .playbtn {
                display: block;
                text-align: center;
                background: #4ee060;
                color: #101016;
                font-weight: bold;
                text-decoration: none;
                border-radius: 5px;
                padding: 10px;
                font-size: 14px;
            }
            .dailyFoot { color: #5a5a62; font-size: 11px; text-align: center; }

            /* ---- leaderboard rows (daily teasers + overlay board) ---- */
            .lb { display: flex; flex-direction: column; gap: 2px; }
            .lbrow {
                display: flex;
                gap: 8px;
                font-size: 12px;
                padding: 3px 6px;
                background: #181c24;
                border-radius: 3px;
            }
            .lbrow .lbrank { color: #5a5a62; width: 18px; text-align: right; }
            .lbrow .lbname { flex: 1; }
            .lbrow .lbtime { color: #e6d04e; }
            .lbrow.you { background: #1c2b1e; outline: 1px solid #4ee060; }
            .lbrow.you .lbname { color: #4ee060; font-weight: bold; }

            /* ---- play page ---- */
            .topbar {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 6px 8px;
                border-bottom: 1px solid #2e3444;
                flex: 0 0 auto;
            }
            .topbar .title {
                color: #4ee060;
                font-weight: bold;
                letter-spacing: 1px;
                flex: 1;
                text-decoration: none;
                font-size: 13px;
                white-space: nowrap;
            }
            .tbtn {
                background: #181c24;
                color: #c8c8ce;
                border: 1px solid #2e3444;
                border-radius: 3px;
                padding: 6px 10px;
                font: inherit;
                font-size: 12px;
                text-decoration: none;
            }
            .tbtn.primary { background: #4ee060; color: #101016; font-weight: bold; }
            .hud { display: flex; align-items: baseline; gap: 8px; flex: 1; justify-content: flex-end; }
            .hudGoal {
                color: #8a8a92;
                font-size: 11px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 40vw;
            }
            .hudTimer { color: #e6d04e; font-size: 16px; font-weight: bold; }
            .screenWrap { position: relative; flex: 0 0 auto; }
            .screen {
                width: 100%;
                aspect-ratio: 320 / 256;
                background: #000;
                image-rendering: pixelated;
                display: block;
                flex: 0 0 auto;
            }
            .statusbar {
                padding: 3px 8px;
                font-size: 11px;
                color: #8a8a92;
                border-bottom: 1px solid #2e3444;
                flex: 0 0 auto;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .hintbar {
                padding: 4px 8px;
                font-size: 11px;
                color: #6f7f6f;
                border-bottom: 1px solid #2e3444;
                flex: 0 0 auto;
            }
            .numrow {
                display: flex;
                height: 64px;
                flex: 0 0 auto;
                border-bottom: 1px solid #2e3444;
            }
            .numkey {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #181c24;
                color: #e6d04e;
                font-size: 17px;
                border-right: 0.5px solid #2e3444;
                touch-action: none;
            }
            .numkey:last-child { border-right: none; }
            .numkey.on {
                background: #3a3416;
                color: #fff3c2;
            }
            .controls {
                flex: 1 1 auto;
                display: flex;
                min-height: 0;
                position: relative; /* the gamepad library positions inside */
                touch-action: none;
            }
            /* DPad and fire button visuals come from @rbuljan/gamepad
               (inline styles); keep them above the dark background. */
            #controls .Gamepad-controller {
                opacity: 0.92;
            }

            /* ---- completion overlay ---- */
            .overlay {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(8, 10, 14, 0.82);
                z-index: 10;
            }
            .panel {
                width: min(86%, 340px);
                max-height: 92%;
                overflow-y: auto;
                background: #15181f;
                border: 1px solid #4ee060;
                border-radius: 8px;
                padding: 14px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .panelTitle {
                color: #4ee060;
                font-weight: bold;
                letter-spacing: 1px;
                font-size: 14px;
            }
            .panelTime { color: #e6d04e; font-size: 30px; font-weight: bold; }
            .panelRank { color: #8a8a92; font-size: 12px; }
            .panelNote { color: #5a5a62; font-size: 11px; }
            .panelBtns { display: flex; gap: 8px; flex-wrap: wrap; }

            /* Landscape: cap the screen so the controls stay reachable. */
            @media (orientation: landscape) {
                .screen { height: 62dvh; width: auto; margin: 0 auto; }
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src=".elmish-land/App/App.fs.js"></script>
    </body>
</html>
