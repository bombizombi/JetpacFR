<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta charset="UTF-8">
        <title>Game Changer</title>
        <style>
            /* Mobile-first play page: screen on top, touch controls filling the
               rest (fire left third, 8-direction keypad right two-thirds). */
            * { box-sizing: border-box; }
            html, body {
                margin: 0;
                height: 100%;
                overscroll-behavior: none;
                background: #101016;
            }
            body {
                font-family: Consolas, monospace;
                color: #c8c8ce;
                overflow: hidden;
                -webkit-user-select: none;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
            }
            #app, .app {
                height: 100dvh;
                display: flex;
                flex-direction: column;
            }
            .topbar {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 6px 8px;
                border-bottom: 1px solid #2e3444;
                flex: 0 0 auto;
            }
            .topbar .title {
                color: #4ee060;
                font-weight: bold;
                letter-spacing: 1px;
                flex: 1;
            }
            .tbtn {
                background: #181c24;
                color: #c8c8ce;
                border: 1px solid #2e3444;
                border-radius: 3px;
                padding: 6px 10px;
                font: inherit;
                font-size: 12px;
            }
            .screen {
                width: 100%;
                aspect-ratio: 320 / 256;
                background: #000;
                image-rendering: pixelated;
                display: block;
                flex: 0 0 auto;
            }
            .statusbar {
                padding: 3px 8px;
                font-size: 11px;
                color: #8a8a92;
                border-bottom: 1px solid #2e3444;
                flex: 0 0 auto;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .numrow {
                display: flex;
                height: 64px;
                flex: 0 0 auto;
                border-bottom: 1px solid #2e3444;
            }
            .numkey {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #181c24;
                color: #e6d04e;
                font-size: 17px;
                border-right: 0.5px solid #2e3444;
                touch-action: none;
            }
            .numkey:last-child { border-right: none; }
            .numkey.on {
                background: #3a3416;
                color: #fff3c2;
            }
            .controls {
                flex: 1 1 auto;
                display: flex;
                min-height: 0;
                position: relative; /* the gamepad library positions inside */
                touch-action: none;
            }
            /* DPad and fire button visuals come from @rbuljan/gamepad
               (inline styles); keep them above the dark background. */
            #controls .Gamepad-controller {
                opacity: 0.92;
            }
            /* Landscape: cap the screen so the controls stay reachable. */
            @media (orientation: landscape) {
                .screen { height: 62dvh; width: auto; margin: 0 auto; }
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src=".elmish-land/App/App.fs.js"></script>
    </body>
</html>
